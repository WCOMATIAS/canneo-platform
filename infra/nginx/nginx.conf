# CANNEO Production Nginx Configuration
# Last updated: 2024

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Connection limits
    limit_conn addr 100;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers map
    map $sent_http_content_type $security_headers {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.canneo.com.br wss://api.canneo.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    # Upstream definitions
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    upstream hooks_backend {
        server hooks:3010;
        keepalive 16;
    }

    upstream admin_backend {
        server admin:3001;
        keepalive 16;
    }

    upstream doctor_backend {
        server doctor:3002;
        keepalive 16;
    }

    upstream patient_backend {
        server patient:3003;
        keepalive 16;
    }

    upstream pharmacy_backend {
        server pharmacy:3004;
        keepalive 16;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name *.canneo.com.br canneo.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API Server - api.canneo.com.br
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.canneo.com.br;

        ssl_certificate /etc/nginx/ssl/api.canneo.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/api.canneo.com.br/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # CORS headers
        add_header Access-Control-Allow-Origin "https://web.canneo.com.br https://medico.canneo.com.br https://adm.canneo.com.br https://farma.canneo.com.br" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://web.canneo.com.br https://medico.canneo.com.br https://adm.canneo.com.br https://farma.canneo.com.br";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Auth endpoints with stricter rate limiting
        location ~ ^/api/auth/(login|register|forgot-password) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # Health check
        location /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        location / {
            return 404;
        }
    }

    # Webhooks Server - hooks.canneo.com.br
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hooks.canneo.com.br;

        ssl_certificate /etc/nginx/ssl/hooks.canneo.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/hooks.canneo.com.br/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location / {
            limit_req zone=webhooks burst=200 nodelay;
            proxy_pass http://hooks_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location /health {
            proxy_pass http://hooks_backend;
            access_log off;
        }
    }

    # Admin Portal - adm.canneo.com.br
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name adm.canneo.com.br;

        ssl_certificate /etc/nginx/ssl/adm.canneo.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/adm.canneo.com.br/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $security_headers always;

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://admin_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # Static assets caching
        location /_next/static/ {
            proxy_pass http://admin_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # API proxy to main API
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }

    # Doctor Portal - medico.canneo.com.br
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name medico.canneo.com.br;

        ssl_certificate /etc/nginx/ssl/medico.canneo.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/medico.canneo.com.br/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $security_headers always;

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://doctor_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location /_next/static/ {
            proxy_pass http://doctor_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }

    # Patient Portal - web.canneo.com.br
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name web.canneo.com.br canneo.com.br;

        ssl_certificate /etc/nginx/ssl/web.canneo.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/web.canneo.com.br/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $security_headers always;

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://patient_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location /_next/static/ {
            proxy_pass http://patient_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }

    # Pharmacy Portal - farma.canneo.com.br
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name farma.canneo.com.br;

        ssl_certificate /etc/nginx/ssl/farma.canneo.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/farma.canneo.com.br/privkey.pem;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $security_headers always;

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://pharmacy_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location /_next/static/ {
            proxy_pass http://pharmacy_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }
}
