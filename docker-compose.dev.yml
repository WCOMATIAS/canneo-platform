version: '3.9'

services:
  # ===========================================
  # PostgreSQL 16 - Database Principal
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: canneo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: canneo
      POSTGRES_PASSWORD: canneo_password
      POSTGRES_DB: canneo_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canneo -d canneo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canneo-network

  # ===========================================
  # Redis 7 - Cache e Filas
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: canneo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canneo-network

  # ===========================================
  # MinIO - Object Storage (S3 Compatible)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: canneo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: canneo_minio
      MINIO_ROOT_PASSWORD: canneo_minio_secret
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - canneo-network

  # ===========================================
  # MinIO Setup - Cria buckets iniciais
  # ===========================================
  minio-setup:
    image: minio/mc:latest
    container_name: canneo-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set canneo http://minio:9000 canneo_minio canneo_minio_secret;
      mc mb canneo/canneo-uploads --ignore-existing;
      mc mb canneo/canneo-documents --ignore-existing;
      mc mb canneo/canneo-prescriptions --ignore-existing;
      mc mb canneo/canneo-recordings --ignore-existing;
      mc anonymous set download canneo/canneo-uploads;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - canneo-network

  # ===========================================
  # Mailhog - SMTP para desenvolvimento
  # ===========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: canneo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - canneo-network

networks:
  canneo-network:
    driver: bridge
    name: canneo-network

volumes:
  postgres_data:
    name: canneo-postgres-data
  redis_data:
    name: canneo-redis-data
  minio_data:
    name: canneo-minio-data
